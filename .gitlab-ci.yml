stages:
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Shared Docker image from weather-generation/docker-images
  SHARED_IMAGE: "$CI_REGISTRY/weather-generation/docker-images/python-3.13:latest"

.python_setup: &python_setup
  image: $SHARED_IMAGE
  before_script:
    - export PATH="/root/.local/bin:/app/.venv/bin:$PATH"
    # Upgrade pip and build tools
    - uv pip install --upgrade pip setuptools wheel

test-build:
  <<: *python_setup
  stage: test
  tags:
    - r9x
  script:
    - uv sync --group test

    # Build package
    - uv build

    # List built artifacts
    - ls -lh dist/

    # Install built wheel
    - uv pip install dist/*.whl

    # Run tests (skip network tests)
    - pytest --pyargs varwg -v -m "not network"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /\*\*\.md/
      - $CI_COMMIT_MESSAGE =~ /docs\//

build-wheels:
  <<: *python_setup
  stage: build
  tags:
    - r9x
  script:
    - uv sync
    - uv build --wheel
    - mkdir -p wheelhouse
    - mv dist/*.whl wheelhouse/
    - ls -lh wheelhouse/
    - uv tool run twine check wheelhouse/*.whl
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG != null'
    - when: manual
  allow_failure: true

build-sdist:
  <<: *python_setup
  stage: build
  tags:
    - r9x
  script:
    - uv sync
    - uv build --sdist
    - ls -lh dist/
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG != null'
    - when: manual

publish:
  image: $SHARED_IMAGE
  stage: publish
  tags:
    - r9x
  before_script:
    - export PATH="/root/.local/bin:/app/.venv/bin:$PATH"
  script:
    - mkdir -p dist
    - mv wheelhouse/*.whl dist/ || true
    - ls -lh dist/
    - uv tool run twine check dist/*.whl dist/*.tar.gz
    - uv tool run twine upload dist/*.whl dist/*.tar.gz --username __token__ $PYPI_TOKEN
  artifacts:
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_TAG != null'
    - when: manual
  allow_failure: true
